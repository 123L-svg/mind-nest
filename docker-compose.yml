services:
  mysql:
    image: mysql:8.0
    container_name: ai-note-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_note
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 生产不暴露端口，仅容器内通信
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表
      - ./backend/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: ai-note-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 生产不暴露端口

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-note-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # 生产不暴露 AMQP 与管理台端口
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-note-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # 生产不暴露端口，文件通过 Nginx 反代访问
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-note-backend
    restart: unless-stopped
    extra_hosts:
      # Windows/Mac Docker Desktop：容器内访问宿主机 ES（9201 映射）
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.chatanywhere.tech/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
      FILE_UPLOAD_DIR: /app/upload
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ES_URIS: ${ES_URIS:-http://host.docker.internal:9201}
      NOTE_SEARCH_ENGINE: ${NOTE_SEARCH_ENGINE:-elasticsearch}
      ES_REINDEX_ON_START: ${ES_REINDEX_ON_START:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_STORE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: note-files
      NOTE_RECYCLE_KEEP_DAYS: ${NOTE_RECYCLE_KEEP_DAYS:-30}
    # 生产不暴露端口，对外统一走 Nginx 反代
    volumes:
      - upload-data:/app/upload
    mem_limit: 1g

  web:
    build: ./frontend
    container_name: ai-note-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL 证书只读挂载（宿主机目录需已存在 pem/key 文件）
      - /data/nginx/cert:/etc/nginx/cert:ro

volumes:
  mysql-data:
  upload-data:
  minio-data: